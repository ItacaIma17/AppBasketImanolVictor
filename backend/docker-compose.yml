services:
  postgres:
    image: postgres:15
    container_name: postgres_db
    restart: always
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: backend_tfg
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    ports:
      - "8080:8080"
    environment:
      # Base de datos
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      - SPRING_DATASOURCE_USERNAME=${POSTGRES_USER}
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD}

      # Configuración del administrador
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_EMAIL=${ADMIN_EMAIL:-admin@admin.com}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-Admin123456}
      - ADMIN_NOMBRE=${ADMIN_NOMBRE:-Administrador}
      - ADMIN_APELLIDO=${ADMIN_APELLIDO:-Sistema}
      - ADMIN_SECRET_KEY=${ADMIN_SECRET_KEY:-ADMIN_SECRET_KEY_2024}

      # Configuración del entrenador por defecto
      - DEFAULT_ENTRENADOR_USERNAME=${DEFAULT_ENTRENADOR_USERNAME:-entrenador}
      - DEFAULT_ENTRENADOR_EMAIL=${DEFAULT_ENTRENADOR_EMAIL:-entrenador@test.com}
      - DEFAULT_ENTRENADOR_PASSWORD=${DEFAULT_ENTRENADOR_PASSWORD:-Entrenador123}
      - DEFAULT_ENTRENADOR_CODIGO=${DEFAULT_ENTRENADOR_CODIGO:-ENT-100001}

      # Configuración del árbitro por defecto
      - DEFAULT_ARBITRO_USERNAME=${DEFAULT_ARBITRO_USERNAME:-arbitro}
      - DEFAULT_ARBITRO_EMAIL=${DEFAULT_ARBITRO_EMAIL:-arbitro@test.com}
      - DEFAULT_ARBITRO_PASSWORD=${DEFAULT_ARBITRO_PASSWORD:-Arbitro123}
      - DEFAULT_ARBITRO_CODIGO=${DEFAULT_ARBITRO_CODIGO:-ARB-100001}

      # Configuración del jugador por defecto
      - DEFAULT_JUGADOR_USERNAME=${DEFAULT_JUGADOR_USERNAME:-jugador}
      - DEFAULT_JUGADOR_EMAIL=${DEFAULT_JUGADOR_EMAIL:-jugador@test.com}
      - DEFAULT_JUGADOR_PASSWORD=${DEFAULT_JUGADOR_PASSWORD:-Jugador123}
      - DEFAULT_JUGADOR_CODIGO=${DEFAULT_JUGADOR_CODIGO:-JUG-100001}

      # JWT
      - JWT_SECRET=${JWT_SECRET:-miClaveSecretaParaJWT123456789012345678901234567890}
      - JWT_EXPIRATION=${JWT_EXPIRATION:-86400000}

      # Logging
      - LOGGING_LEVEL_APLICACION=DEBUG
      - LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_SECURITY=DEBUG
    volumes:
      - ./logs:/app/logs

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pgadmin_tfg
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@admin.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin123}
    ports:
      - "5050:80"
    depends_on:
      - postgres

volumes:
  postgres_data: